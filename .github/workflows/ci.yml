name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests & build ────────────────────────────────────────────────────────
  unit:
    name: Build & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cqrs/go.mod
          cache: true

      - name: Download dependencies
        working-directory: cqrs
        run: go mod download

      - name: Build
        working-directory: cqrs
        run: go build ./...

      - name: Unit tests
        working-directory: cqrs
        run: go test -race -count=1 ./internal/...

  # ── Integration tests ─────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U db_user -d db_name"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo_user
          MONGO_INITDB_ROOT_PASSWORD: mongo_password
          MONGO_INITDB_DATABASE: email_service
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cqrs/go.mod
          cache: true

      - name: Download dependencies
        working-directory: cqrs
        run: go mod download

      - name: Apply PostgreSQL schema
        run: |
          PGPASSWORD=db_password psql \
            -h 127.0.0.1 -U db_user -d db_name \
            -f cqrs/init.sql

      - name: Integration tests
        working-directory: cqrs
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: db_name
          TEST_POSTGRES_HOST: 127.0.0.1
          MONGO_INITDB_ROOT_USERNAME: mongo_user
          MONGO_INITDB_ROOT_PASSWORD: mongo_password
          TEST_MONGO_HOST: 127.0.0.1
        run: go test -tags integration -race -count=1 -timeout 60s ./internal/integration/...
