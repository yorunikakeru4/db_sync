version: "3"

tasks:
  init:
    desc: "Create .env from .env.example (skips if .env already exists)"
    cmds:
      - cp .env.example .env
      - echo ".env created — fill in your secrets before running 'task up'"
    status:
      - test -f .env

  up:
    desc: "Start shared infrastructure (default: podman)"
    cmds:
      - task: up:podman

  up:podman:
    desc: "Start PostgreSQL, MongoDB and Kafka with podman compose"
    cmds:
      - podman-compose up -d

  up:docker:
    desc: "Start PostgreSQL, MongoDB and Kafka with docker compose"
    cmds:
      - docker compose up -d

  down:
    desc: "Stop shared infrastructure (default: podman)"
    cmds:
      - task: down:podman

  down:podman:
    cmds:
      - podman-compose down

  down:docker:
    cmds:
      - sudo docker compose down

  cqrs:deps:
    desc: "Download and tidy CQRS module dependencies"
    dir: cqrs
    cmds:
      - task deps

  cqrs:build:
    desc: "Build the CQRS sync service"
    dir: cqrs
    cmds:
      - task build

  cqrs:run:
    desc: "Run the CQRS sync service"
    dir: cqrs
    cmds:
      - task run

  cqrs:test:
    desc: "Run CQRS unit tests"
    dir: cqrs
    cmds:
      - task test

  cqrs:test:integration:
    desc: "Run CQRS integration tests against shared infrastructure"
    dir: cqrs
    cmds:
      - task test:integration

  cqrs:watch:
    desc: "Watch and restart the CQRS sync service"
    dir: cqrs
    cmds:
      - task watch

  backend:deps:
    desc: "Download and tidy backend module dependencies"
    dir: backend
    cmds:
      - task deps

  backend:build:
    desc: "Build the backend API service"
    dir: backend
    cmds:
      - task build

  backend:run:
    desc: "Run the backend API service"
    dir: backend
    cmds:
      - task run

  backend:test:
    desc: "Run backend unit tests"
    dir: backend
    cmds:
      - task test

  backend:test:integration:
    desc: "Run backend integration tests against shared infrastructure"
    dir: backend
    cmds:
      - task test:integration

  backend:watch:
    desc: "Watch and restart the backend API service"
    dir: backend
    cmds:
      - task watch

  dev:
    desc: "Run CQRS and backend together"
    cmds:
      - |
        bash -lc '
          trap "kill 0" EXIT INT TERM
          (cd cqrs && task run) &
          (cd backend && task run) &
          wait
        '
